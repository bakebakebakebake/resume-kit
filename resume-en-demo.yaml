      - "**Databases**: `PostgreSQL`, `MySQL`, `MongoDB`, `Redis`; solid grasp of **indexing**, **query optimization**, **ACID**, and **CAP theorem**."
      - "**Infrastructure**: `Docker`, `Kubernetes`, `AWS` (EC2, S3, RDS, Lambda), `Terraform`; hands-on experience with **CI/CD** pipelines using `GitHub Actions`."
      - "**Observability**: `Prometheus`, `Grafana`, `OpenTelemetry`, `Datadog`; proficient in distributed tracing and log aggregation with `ELK` stack."
