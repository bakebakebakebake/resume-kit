  - title: Experience
    entries:
      - org: Stripe
        meta: Backend Engineering Intern
        when: 2022.06 — 2022.12
        brief: Contributed to payment processing infrastructure, focusing on transaction reliability, idempotency, and observability improvements.
        points:
          - "**Payment reliability improvements**: Implemented **automatic retry with exponential backoff** for transient failures, reducing payment error rate by `15%`; added `Redis`-based distributed locks to prevent duplicate charges during network retries."
          - "**Idempotency key enforcement**: Built middleware to validate idempotency keys across payment endpoints, preventing **duplicate transactions** from client retries; achieved `100%` coverage on high-risk endpoints within 2 months."
          - "**Observability enhancements**: Instrumented payment flows with `OpenTelemetry` spans, enabling **end-to-end tracing** from API gateway to database; reduced **mean time to resolution** for payment incidents from `45min` to `12min`."

  # ── Projects ──────────────────────────────────
  - title: Projects
    variant: project
    entries:
      - org: Distributed Task Scheduler
        meta: Open Source · 1.2k GitHub stars
        brief: Lightweight distributed task scheduling framework supporting cron expressions, task sharding, failure retries, and execution logs.
        points:
          - Built **scheduler-executor RPC** using `Netty + ZooKeeper` for dynamic registration and heartbeat monitoring; tasks automatically failover to healthy executors on node crashes.
          - Leveraged `Quartz` for scheduling with support for **cron, fixed-rate, and one-shot** modes; persisted task state in `MySQL` for crash recovery.
          - Designed **task sharding** algorithm using `hash(item_id) % shard_count` to parallelize large jobs across executors, achieving `10x` throughput improvement.
          - Provided **Web UI** for job management and real-time execution logs; deployed on `AWS ECS` with `CloudWatch` monitoring.

      - org: Real-Time Chat Application
        meta: Full Stack · Team of 3
        brief: Scalable chat platform supporting direct messaging, group chat, presence, and media uploads, serving `5k+` active users.
        points:
          - "**Backend**: `Node.js + Express + PostgreSQL + Redis`; used `Socket.io` for **WebSocket** connections with **Redis pub/sub** for horizontal scaling across multiple servers."
          - "**Message delivery**: Implemented **at-least-once delivery** with client-side deduplication using message IDs; stored offline messages in `PostgreSQL` and pushed on reconnect."
          - "**Media handling**: Integrated `AWS S3` for file uploads with **presigned URLs**; compressed images using `sharp` before storage, reducing bandwidth by `60%`."
          - "**Deployment**: Containerized with `Docker`, orchestrated with `Kubernetes` on `GKE`; set up `Prometheus + Grafana` for monitoring and `Sentry` for error tracking."

