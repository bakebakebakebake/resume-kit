# ─────────────────────────────────────────────────────────────
#  简历数据示例（中文）
#
#  正文里支持两种行内标记：
#    **重点**    → 加粗（在要点里是深色强调，在技能里是轻量强调）
#    `技术名`    → 等宽 + 主题色，用来标 Redis / Explain / RocketMQ 这类术语
#
#  以 ** 开头的字符串必须加引号，否则 YAML 会把 * 当成锚点引用。
#
#  也可以跑 npm run studio 在浏览器里改，存盘会重写这个文件。
# ─────────────────────────────────────────────────────────────

