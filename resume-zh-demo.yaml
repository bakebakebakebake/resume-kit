  # ── 实习经历 ──────────────────────────────────
  - title: 实习经历
    entries:
      - org: 字节跳动
        meta: 后端开发实习生
        when: 2023.06 — 2023.12
        brief: 参与抖音电商订单履约系统的开发与优化，主要负责订单状态流转、库存扣减、分布式事务等核心模块。
        points:
          - "**订单履约链路优化**：通过 `Redis` 缓存热点商品库存，配合 `Lua` 脚本原子操作，将库存扣减接口 `P99` 延迟从 `120ms` 降至 `35ms`；引入 `RocketMQ` 异步削峰，抗住促销期间 **3 倍流量**冲击。"
          - "**分布式事务治理**：基于 `Seata AT` 模式改造订单 - 库存 - 积分三方事务，解决跨服务数据一致性问题；通过**本地消息表 + 定时补偿**兜底极端场景，事故率下降 `90%`。"
          - "**慢查询治理**：利用 `Explain` + `pt-query-digest` 分析慢 SQL，通过**索引优化**和**分页改写**，核心列表页查询耗时降低 `70%`；推动 DBA 对高频表进行**垂直分库**，缓解主库压力。"

  # ── 项目经历 ──────────────────────────────────
  - title: 项目经历
    variant: project
    entries:
      - org: 校园二手交易平台
        meta: 全栈项目 · 团队 3 人
        brief: 面向校内学生的二手物品交易平台，支持商品发布、搜索、在线聊天、订单管理等功能，日活用户 `800+`。
        points:
          - "**后端架构**：采用 `Spring Boot + MyBatis-Plus + Redis + MySQL` 技术栈；引入 `Caffeine` 本地缓存与 `Redis` 组成**二级缓存**，热点商品查询 `QPS` 提升 `5` 倍。"
          - "**即时通讯**：基于 `WebSocket` 实现在线聊天，利用 `Netty` 构建消息推送网关，支持**单聊、消息已读回执、离线消息**；消息送达率 `99.5%`。"
          - "**搜索优化**：接入 `Elasticsearch`，支持商品标题 / 描述的**全文检索**和**价格区间筛选**；通过 `IK` 分词器提升中文搜索准确率，搜索响应时间 `< 50ms`。"
          - "**DevOps 实践**：使用 `Docker Compose` 编排服务，`GitHub Actions` 自动化构建部署；`Prometheus + Grafana` 监控系统指标，告警响应时间 `< 5min`。"

      - org: 分布式任务调度系统
        meta: 个人项目
        brief: 轻量级分布式任务调度框架，支持 Cron 表达式、任务分片、失败重试、执行日志等功能。
        points:
          - 基于 `Netty + ZooKeeper` 实现**调度中心与执行器**的 RPC 通信，支持**动态注册**和**心跳检测**；执行器下线后任务自动转移到其它节点。
          - 利用 `Quartz` 管理任务调度，支持 **Cron 定时 + 固定频率 + 单次执行**三种模式；任务状态通过 `MySQL` 持久化，重启后自动恢复。
          - 实现**任务分片**算法，大任务按 `hash(item_id) % shard_count` 切分到多个执行器并行处理，吞吐量提升 `10` 倍。

  # ── 专业技能 ──────────────────────────────────
  - title: 专业技能
    variant: list
    items:
      - 熟练掌握 Java 基础，深入理解 **JVM 内存模型**、**垃圾回收**机制，熟悉 **JUC** 并发工具类及锁优化。
      - 熟练使用 Spring 全家桶（`Spring Boot`、`Spring Cloud Alibaba`），了解 **IOC / AOP** 原理，了解微服务拆分与治理。
      - 熟练使用 MySQL，深入理解 **InnoDB 索引结构**、事务隔离级别、**MVCC** 与锁机制，熟悉慢查询优化与分库分表。
      - 熟悉 Redis 数据结构与**持久化机制**，了解缓存穿透 / 击穿 / 雪崩解决方案，了解**哨兵 + 集群**高可用架构。
      - 了解 Docker 容器化、`Nginx` 反向代理、`Prometheus` 监控，了解 `Git` 工作流与 CI/CD 流程。

