<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>简历工作台</title>
<link rel="stylesheet" href="/studio/chrome.css">
</head>
<body>

<header class="bar">
  <div class="bar-l">
    <span class="logo">简历工作台</span>
    <span class="file" id="file-name" title=""></span>
  </div>
  <div class="bar-c">
    <span class="fit" id="fit" data-state="idle">量尺寸…</span>
    <button class="btn ghost" id="btn-page-limit" title="切换单页/多页模式">📄 限制一页</button>
  </div>
  <div class="bar-r">
    <button class="btn ghost" id="btn-undo" title="撤销 ⌘Z" disabled>撤销</button>
    <button class="btn ghost" id="btn-redo" title="重做 ⇧⌘Z" disabled>重做</button>
    <button class="btn primary" id="btn-save" title="保存到 resume.yaml  ⌘S">保存</button>
  </div>
</header>

<main class="wrap">
  <div class="stage" id="stage">
    <div class="paper-hold">
      <iframe id="paper" title="简历预览" src="about:blank"></iframe>
    </div>
    <div class="stage-foot">
      <button class="btn ghost" id="btn-add-section">+ 加一个章节</button>
    </div>
  </div>

  <aside class="side">
    <div class="side-scroll">

      <section class="grp">
        <h3>版式</h3>
        <p class="hint">内容超一页时先动这两个</p>
        <div id="knobs-type"></div>
      </section>

      <section class="grp">
        <h3>配色</h3>
        <div id="knobs-color" class="swatches"></div>
      </section>

      <section class="grp">
        <h3>皮肤</h3>
        <select id="skin" class="inp"></select>
        <p class="hint" id="skin-hint"></p>
      </section>

      <section class="grp">
        <h3>章节</h3>
        <ul class="sec-list" id="sec-list"></ul>
      </section>

      <section class="grp">
        <h3>导出</h3>
        <div class="fmts" id="fmts">
          <label><input type="checkbox" value="pdf" checked> <b>PDF</b><i>投递主力，矢量可选字</i></label>
          <label><input type="checkbox" value="png"> <b>PNG</b><i>整页截图，发微信用</i></label>
          <label><input type="checkbox" value="docx"> <b>Word</b><i>语义版式，给只收 docx 的</i></label>
          <label><input type="checkbox" value="html"> <b>HTML</b><i>单文件，字体已内联</i></label>
        </div>
        <button class="btn primary wide" id="btn-export">导出</button>
        <div class="results" id="results"></div>
      </section>

      <section class="grp">
        <h3>怎么用</h3>
        <ul class="tips">
          <li>点简历上任何文字直接改</li>
          <li>鼠标移到一行,左边出现 <b>⠿ + ×</b>:拖动排序、加一条、删一条</li>
          <li>要点和技能支持 <code>**重点**</code> 和 <code>`技术名`</code>,选中文字按 <b>⌘B</b> / <b>⌘E</b></li>
          <li>改完点保存,写回 <code>resume.yaml</code>,旧版本留在 <code>.studio-backups/</code></li>
        </ul>
      </section>

    </div>
  </aside>
</main>

<div class="fmt-bar" id="fmt-bar" hidden>
  <button data-wrap="**" title="加粗 ⌘B"><b>B</b></button>
  <button data-wrap="`" title="技术名 ⌘E"><code>T</code></button>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="/studio/editor.js"></script>
</body>
</html>
